# Optional deployment blueprint for the existing repository. No secrets belong in Git.
services:
  - type: web
    name: munjiz-academic
    runtime: node
    plan: free
    buildCommand: node --check server/index.mjs
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: BIND_ADDRESS
        value: 0.0.0.0
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SITE_ORIGIN
        sync: false
