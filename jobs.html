<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوابة الباحثين عن التعيين — مُنجز أكاديمي</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="brand">مُنجز أكاديمي</a>
    <nav class="main-nav">
      <a href="index.html">الرئيسية</a>
      <a href="defenses.html">🎓 المناقشات</a>
    </nav>
  </div>
</header>
<main>
<section class="section" id="jobs-page">
  <div class="container">
    <header class="section-head">
      <h2>💼 بوابة الباحثين عن التعيين</h2>
      <p>سجّل معلوماتك الأساسية لنرشحك للفرص الأكاديمية المناسبة لتخصصك.</p>
    </header>
    </div>
    <form class="job-form" id="jobSeekerForm" novalidate>
      <div class="form-grid">
        <label>الاسم الكامل *
          <input type="text" name="name" required maxlength="100" placeholder="مثال: أحمد محمد علي">
        </label>
        <label>العمر *
          <input type="number" name="age" required min="20" max="70" placeholder="مثال: 32">
        </label>
        <label>الجنس
          <select name="gender">
            <option value="">— اختر —</option>
            <option value="ذكر">ذكر</option>
            <option value="أنثى">أنثى</option>
          </select>
        </label>
        <label>الشهادة *
          <select name="degree" required>
            <option value="">— اختر الشهادة —</option>
            <option value="دكتوراه">دكتوراه</option>
            <option value="ماجستير">ماجستير</option>
            <option value="بكالوريوس">بكالوريوس</option>
            <option value="دبلوم عالٍ">دبلوم عالٍ</option>
            <option value="دبلوم">دبلوم</option>
          </select>
        </label>
        <label>التخصص الدقيق *
          <input type="text" name="specialization" required maxlength="120" placeholder="مثال: فيزياء طبية">
        </label>
        <label>الجامعة / المعهد
          <input type="text" name="university" maxlength="120" placeholder="جهة التخرج">
        </label>
        <label>سنة التخرج
          <input type="number" name="graduation_year" min="1980" max="2026" placeholder="مثال: 2022">
        </label>
        <label>محافظة السكن *
          <select name="governorate" required>
            <option value="">— اختر المحافظة —</option>
            <option>بغداد</option><option>البصرة</option><option>نينوى</option>
            <option>أربيل</option><option>السليمانية</option><option>دهوك</option>
            <option>كركوك</option><option>صلاح الدين</option><option>الأنبار</option>
            <option>ديالى</option><option>واسط</option><option>بابل</option>
            <option>كربلاء</option><option>النجف</option><option>ذي قار</option>
            <option>ميسان</option><option>المثنى</option><option>القادسية</option>
          </select>
        </label>
        <label>رقم الهاتف *
          <input type="tel" name="phone" required maxlength="20" placeholder="07xxxxxxxxx" dir="ltr">
        </label>
        <label>البريد الإلكتروني
          <input type="email" name="email" maxlength="120" placeholder="name@email.com" dir="ltr">
        </label>
        <label>سنوات الخبرة
          <input type="number" name="experience" min="0" max="40" placeholder="مثال: 3">
        </label>
        <label class="full-width">نبذة مختصرة
          <textarea name="bio" rows="3" maxlength="500" placeholder="خبراتك ومهاراتك باختصار…"></textarea>
        </label>
      </div>
      <p class="form-note">بتسجيلك أنت توافق على مشاركة بياناتك مع الجهات الأكاديمية لغرض التوظيف.</p>
      <button type="submit" class="btn btn-primary">تسجيل البيانات ←</button>
      <p class="form-status" id="jobFormStatus" role="status"></p>
    </form>
  </div>
</section>
</main>
<script>
(function () {
  var form = document.getElementById('jobSeekerForm');
  if (!form) return;
  var status = document.getElementById('jobFormStatus');
  var WORKER = 'https://munjaz-academic.alsobahi73.workers.dev';
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!form.checkValidity()) { form.reportValidity(); return; }
    status.className = 'form-status'; status.textContent = 'جارٍ الإرسال…';
    var data = {};
    new FormData(form).forEach(function (v, k) { data[k] = String(v).trim(); });
    data.kind = 'job-seeker';
    fetch(WORKER + '/api/academic-requests', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    }).then(function (r) {
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json();
    }).then(function () {
      status.className = 'form-status ok';
      status.textContent = 'تم استلام بياناتك بنجاح ✅ سنتواصل معك عند توفر فرصة مناسبة.';
      form.reset();
    }).catch(function () {
      status.className = 'form-status err';
      status.textContent = 'تعذر الإرسال — حاول مرة أخرى لاحقًا.';
    });
  });
})();
</script>
</body>
</html>
