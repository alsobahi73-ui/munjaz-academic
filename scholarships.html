<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دليل المنح الدراسية — مُنجز أكاديمي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
  <link rel="canonical" href="https://alsobahi73-ui.github.io/munjaz-academic/scholarships.html">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="index.html" aria-label="مُنجز أكاديمي - الرئيسية">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" width="30" height="30" aria-hidden="true"><path d="M33.5 20a13.5 13.5 0 1 1-4-9.6" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round"/><path d="M14 20.5l6.5 6.5L30 15" fill="none" stroke="#E9B949" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="brand-text">
        <strong>مُنجز أكاديمي</strong>
        <small>Munjaz Academic</small>
      </span>
    </a>
    <nav class="main-nav">
      <a href="index.html">الرئيسية</a>
      <a href="services.html">خدماتنا الأكاديمية</a>
      <a href="news.html">أرشيف الأخبار</a>
      <a href="defenses.html">المناقشات</a>
      <a href="jobs.html">بوابة التعيين</a>
      <a href="opportunities.html">فرص وظيفية</a>
      <a href="articles.html">قلم حر</a>
      <a href="scholarships.html" aria-current="page">المنح الدراسية</a>
    </nav>
  </div>
</header>
<main>
<section class="section" id="schol-hero">
  <div class="container">
    <header class="section-head">
      <h1>دليل المنح الدراسية</h1>
      <p>أهم المنح الدولية المتاحة للطلبة العراقيين — التفاصيل، الشروط، والروابط الرسمية.</p>
    </header>
    <div class="schol-filters">
      <input type="search" id="scholSearch" placeholder="ابحث عن منحة أو دولة…">
      <select id="scholLevel"><option value="">كل المراحل</option><option>بكالوريوس</option><option>ماجستير</option><option>دكتوراه</option></select>
    </div>
    <div class="schol-grid" id="scholGrid"><p class="muted" style="text-align:center">جارٍ التحميل…</p></div>
  </div>
</section>
</main>
<script>
(function(){
  function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  var grid=document.getElementById('scholGrid'), data=[];
  function render(){
    var q=(document.getElementById('scholSearch').value||'').trim();
    var lvl=document.getElementById('scholLevel').value;
    grid.innerHTML='';
    var list=data.filter(function(s){
      var okL=!lvl||(s.level||'').indexOf(lvl)>-1;
      var okQ=!q||(s.name+s.country).indexOf(q)>-1;
      return okL&&okQ;
    });
    if(!list.length){grid.innerHTML='<p class="muted" style="text-align:center">لا توجد نتائج.</p>';return;}
    list.forEach(function(s){
      var c=document.createElement('div');c.className='schol-card';
      c.innerHTML='<h3>'+esc(s.name)+'</h3><div class="schol-country">'+esc(s.country)+'</div>'+
        '<dl><div><dt>المرحلة</dt><dd>'+esc(s.level)+'</dd></div>'+
        '<div><dt>التمويل</dt><dd>'+esc(s.funding)+'</dd></div>'+
        '<div><dt>الموعد</dt><dd>'+esc(s.deadline)+'</dd></div>'+
        '<div><dt>الشروط</dt><dd>'+esc(s.requirements)+'</dd></div></dl>'+
        (s.link?'<a class="btn btn-primary btn-sm" href="'+esc(s.link)+'" target="_blank" rel="noopener">الموقع الرسمي ←</a>':'');
      grid.appendChild(c);
    });
  }
  fetch('scholarships.json',{cache:'no-cache'}).then(function(r){return r.json();}).then(function(d){data=d||[];render();})
    .catch(function(){grid.innerHTML='<p class="muted">تعذر التحميل.</p>';});
  document.getElementById('scholSearch').addEventListener('input',render);
  document.getElementById('scholLevel').addEventListener('change',render);
})();
</script>
</body>
</html>
