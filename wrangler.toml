name = "munjaz-academic-requests"
main = "worker/generated.mjs"
compatibility_date = "2026-10-10"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[build]
command = "node worker/build.mjs"

# Set TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID as Worker secrets in Cloudflare.
# Set SITE_ORIGIN to the exact frontend origin in Worker Variables.
# No credentials or guessed frontend URL belong in this file.
