name: Collect news
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: news-publication-state
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r collector/requirements.txt
      - name: Collector regression tests
        run: python -m unittest discover -s collector/tests -v
      - name: Collect due sources
        id: collector
        continue-on-error: true
        run: python -m collector.collect
      - name: Persist queue, dedup, schedule, and failure report
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in news_queue.json seen.json collector_state.json collector_report.json; do
            if [ -f "$file" ]; then git add -- "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update collector state'
            git pull --rebase -X ours origin main || true
            git push origin HEAD:main
          fi
      - name: Preserve actual collector outcome
        if: steps.collector.outcome == 'failure'
        run: exit 1
